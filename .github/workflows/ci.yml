name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # ------------------------------------------------------------------ gates
  unit-tests:
    name: DSP unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (tests only, no plug-in SDKs)
        run: cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUPPRESSOR_BUILD_PLUGIN=OFF -DSUPPRESSOR_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-tests --config Release

      - name: Run unit tests
        run: ctest --test-dir build-tests --output-on-failure -C Release

  # ------------------------------------------------------------------ builds
  build:
    name: Build VST3 + CLAP (${{ matrix.os }})
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb openbox x11-utils \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libgl1-mesa-dev libfreetype6-dev libfontconfig1-dev

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build VST3, CLAP, and UI tests
        run: cmake --build build --config Release --target Suppressor_VST3 Suppressor_CLAP SuppressorUITests

      - name: Run UI tests and capture declared scales
        shell: bash
        run: |
          mkdir -p ui-captures
          if [ "${{ runner.os }}" = "Windows" ]; then
            SUPPRESSOR_UI_CAPTURE_DIR="$(pwd -W)/ui-captures"
          else
            SUPPRESSOR_UI_CAPTURE_DIR="$PWD/ui-captures"
          fi
          export SUPPRESSOR_UI_CAPTURE_DIR
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Native JUCE peers need WM_PROTOCOLS and other window-manager atoms,
            # which a bare Xvfb server does not supply. Variables below belong to
            # the inner shell running on that display.
            # shellcheck disable=SC2016
            xvfb-run -a sh -c '
              openbox --sm-disable >/tmp/suppressor-openbox.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              ready=false
              for attempt in $(seq 1 50); do
                if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
                  ready=true
                  break
                fi
                sleep 0.1
              done
              if [ "$ready" != true ]; then
                echo "Window manager did not start"
                exit 1
              fi
              ctest --test-dir build --output-on-failure -C Release -R suppressor-ui-unit
            '
          else
            ctest --test-dir build --output-on-failure -C Release -R suppressor-ui-unit
          fi
          find ui-captures -type f -name "*.png" -print

      - uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ matrix.os }}
          path: ui-captures/*.png
          retention-days: 14

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          mkdir -p staging
          find build -type d -name "*.vst3" -exec cp -R {} staging/ \;
          find build -name "*.clap" -exec cp -R {} staging/ \;
          find staging -maxdepth 1 -name "*.vst3" -print -quit | grep -q .
          find staging -maxdepth 1 -name "*.clap" -print -quit | grep -q .
          ls -la staging/

      - uses: actions/upload-artifact@v4
        with:
          name: suppressor-${{ matrix.os }}
          path: staging/
          retention-days: 14

  # ------------------------------------------------------------------ validation
  validate:
    name: Validate plug-ins (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: suppressor-${{ matrix.os }}
          path: artifacts

      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libx11-6 libxext6 libxinerama1 \
            libxrandr2 libxcursor1 libgl1 libfreetype6 libfontconfig1

      - name: Download pluginval v1.0.4
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            Linux)   asset=pluginval_Linux.zip ;;
            macOS)   asset=pluginval_macOS.zip ;;
            Windows) asset=pluginval_Windows.zip ;;
          esac
          curl -sL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${asset}" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval-bin
          find pluginval-bin -maxdepth 4 -type f | head -10

      - name: Download clap-validator 0.4.1
        shell: bash
        run: |
          set -e
          base="https://github.com/free-audio/clap-validator/releases/download/0.4.1"
          case "${{ runner.os }}" in
            Linux)   asset=clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip ;;
            macOS)   asset=clap-validator-0.4.1-127-g152b982-macos-universal.zip ;;
            Windows) asset=clap-validator-0.4.1-127-g152b982-windows.zip ;;
          esac
          curl -sL "${base}/${asset}" -o clap-validator.zip
          unzip -q clap-validator.zip -d clap-validator-bin
          # zips wrap a tar.gz: unpack it too
          find clap-validator-bin -name "*.tar.gz" -exec tar xzf {} \;
          find . -maxdepth 4 -type f \( -name clap-validator -o -name clap-validator.exe \)
          mkdir -p clap-validator-extracted
          find . -maxdepth 4 -type f \( -name clap-validator -o -name clap-validator.exe \) \
            -exec cp {} clap-validator-extracted/ \;

      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          set -e
          PLUGINVAL=$(find pluginval-bin -type f \( -name pluginval -o -name pluginval.exe \) | head -1)
          VST3=$(find artifacts -maxdepth 2 -name "*.vst3" | head -1)
          echo "pluginval: ${PLUGINVAL}"
          echo "vst3: ${VST3}"
          chmod +x "${PLUGINVAL}" || true
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "${PLUGINVAL}" --strictness-level 10 --timeout-ms 300000 --validate "${VST3}"
          else
            "${PLUGINVAL}" --strictness-level 10 --timeout-ms 300000 --validate "${VST3}"
          fi

      - name: Validate CLAP with clap-validator
        shell: bash
        run: |
          set -e
          CLAPVAL=$(find clap-validator-extracted -type f \( -name clap-validator -o -name clap-validator.exe \) | head -1)
          CLAP=$(find artifacts -maxdepth 2 -name "*.clap" | head -1)
          echo "clap-validator: ${CLAPVAL}"
          echo "clap: ${CLAP}"
          chmod +x "${CLAPVAL}" || true
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "${CLAPVAL}" validate "${CLAP}"
          else
            "${CLAPVAL}" validate "${CLAP}"
          fi

  # ------------------------------------------------------------------ package
  package:
    name: Package distribution artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: suppressor-*
          path: dist

      - name: Zip per-OS artifacts
        shell: bash
        run: |
          set -e
          cd dist
          for osdir in suppressor-*/; do
            osname=${osdir%/}
            short=${osname#suppressor-}
            (cd "$osdir" && \
             for d in *.vst3; do [ -e "$d" ] && zip -qr "../suppressor-${short}-vst3.zip" "$d"; done && \
             for f in *.clap; do [ -e "$f" ] && zip -qr "../suppressor-${short}-clap.zip" "$f"; done)
          done
          ls -la -- *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: suppressor-dist
          path: dist/*.zip
          retention-days: 30
